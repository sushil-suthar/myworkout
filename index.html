function emptyState(){return {anchorDate:today(),anchorLogical:0,lastSeen:today(),history:{},logs:{},notes:{},overrides:{}}}
function readState(){try{const x=JSON.parse(localStorage.getItem(STORE)||"null");return x&&typeof x==="object"?x:emptyState()}catch(e){return emptyState()}}
let state=readState();
if(!state.anchorDate)state.anchorDate=today();
if(typeof state.anchorLogical!=="number")state.anchorLogical=0;
if(!state.lastSeen)state.lastSeen=today();
if(!state.history)state.history={};
if(!state.logs)state.logs={};
if(!state.notes)state.notes={};
if(!state.overrides)state.overrides={};

function save(){try{localStorage.setItem(STORE,JSON.stringify(state))}catch(e){}}
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function parse(s){const p=s.split("-");return new Date(Number(p[0]),Number(p[1])-1,Number(p[2]))}
function addDays(s,n){const d=parse(s);d.setDate(d.getDate()+n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function days(a,b){return Math.round((parse(b)-parse(a))/86400000)}
function fmt(s){return parse(s).toLocaleDateString("en-IN",{day:"2-digit",month:"short"})}
function baseLogical(date){return state.anchorLogical+days(state.anchorDate,date)}
function logical(date){return Object.prototype.hasOwnProperty.call(state.overrides,date)?Number(state.overrides[date]):baseLogical(date)}
function info(L){if(L<0)return null;const b=Math.floor(L/28)+1;if(b>13)return {complete:true};const r=L%28;return {block:b,week:Math.floor(r/7)+1,day:(r%7)+1}}
function todayInfo(){return info(logical(today()))}
function list(inf){return inf&&!inf.complete?(WORKOUT[String(inf.block)]&&WORKOUT[String(inf.block)][String(inf.day)]||[]):[]}
function key(date,L,name){return date+"|"+L+"|"+name}
function get(date,L,name){return state.logs[key(date,L,name)]||{done:false,load:"",reps:""}}
function put(date,L,name,field,value){const k=key(date,L,name),e=get(date,L,name);e[field]=value;state.logs[k]=e;save()}
function historyKey(date,L){return date+"|"+L}
function stats(){let done=0,missed=0;Object.keys(state.history).forEach(k=>{if(k.indexOf("|")<0)return;if(state.history[k]==="completed")done++;if(state.history[k]==="missed")missed++});const total=done+missed;return {done,missed,adherence:total?Math.round(done*100/total):100}}

function missedWorkouts(){
  const out=[];
  Object.keys(state.history).forEach(function(k){
    if(state.history[k]!=="missed")return;
    const parts=k.split("|"); if(parts.length<2)return;
    const d=parts[0], L=Number(parts[1]), i=info(L);
    if(i && !i.complete && i.day<=6) out.push({date:d,L:L,info:i});
  });
  out.sort(function(a,b){return a.date.localeCompare(b.date)});
  return out;
}
function doMissedToday(item){
  const td=today(), targetL=item.L, currentL=logical(td);
  // Shift today's scheduled workout and everything between it and the missed workout
  // one calendar day forward, then put the missed workout today.
  const dist=days(td,item.date);
  if(dist<1){return;}
  const assignments=[];
  for(let j=0;j<=dist;j++){
    const dd=addDays(td,j);
    assignments.push({date:dd,L:logical(dd)});
  }
  state.overrides[assignments[0].date]=targetL;
  for(let j=1;j<=dist;j++) state.overrides[assignments[j].date]=assignments[j-1].L;
  delete state.history[historyKey(item.date,targetL)];
  save();
  renderToday();
}

function markOldMissed(){const t=today();let d=state.lastSeen||t;while(d<t){const L=logical(d),i=info(L);if(i&&i.day<=6&&!i.complete&&!state.history[historyKey(d,L)])state.history[historyKey(d,L)]="missed";d=addDays(d,1)}state.lastSeen=t;save()}
function setTab(id){document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active"));document.getElementById(id).classList.add("active")}
function esc(x){return String(x==null?"":x).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function imgFallback(name){return "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Barbell_Bench_Press_-_Medium_Grip/0.jpg"}
function openMedia(kind,x){
  const o=document.getElementById("overlay"),b=document.getElementById("overlayBody");
  if(!o||!b)return;
  b.innerHTML="";
  if(kind==="image"){
    b.innerHTML="<img src='"+x.image+"' onerror='this.onerror=null;this.src=\""+imgFallback(x.name)+"\"' alt='"+esc(x.name)+"'><div class='ovtitle'>"+esc(x.name)+"</div><div class='ovsub'>Tap × or outside to close</div>";
  }else{
    const v=DIRECT_VIDEOS[x.name];
    if(v){
      b.innerHTML="<video class='nativeVideo' controls playsinline webkit-playsinline preload='metadata'><source src='"+v.url+"' type='video/webm'></video><div class='ovtitle'>"+esc(v.title)+"</div><div class='ovsub'>"+esc(v.license)+" • played directly in this app</div>";
    }else{
      const q=encodeURIComponent(x.name+" exercise proper form");
      b.innerHTML="<div style='color:white;text-align:center;padding:50px 10px'><div style='font-size:17px;font-weight:800;margin-bottom:11px'>No direct exercise video found</div><div style='font-size:11px;color:#cbd5e1;line-height:1.5;margin-bottom:16px'>No verified direct-hosted demo is linked for this exercise.</div><a href='https://www.youtube.com/results?search_query="+q+"' target='_blank' rel='noopener' style='display:inline-block;background:white;color:#111;padding:11px 14px;border-radius:10px;font-weight:800;text-decoration:none'>Search externally</a></div>";
    }
  }
  o.classList.add("show");
}
function closeMedia(){document.getElementById("overlayBody").innerHTML="";document.getElementById("overlay").classList.remove("show")}
document.getElementById("closeOverlay").onclick=closeMedia;
document.getElementById("overlay").onclick=function(e){if(e.target.id==="overlay")closeMedia()};

function renderToday(){
  setTab("tToday");const d=today(),L=logical(d),i=info(L),app=document.getElementById("app");
  if(!i){app.innerHTML="<div class='notice'>The workout sequence could not be determined.</div>";return}
  if(i.complete){app.innerHTML="<div class='hero'><div class='k'>Program complete</div><h2>52 weeks complete</h2><p>Your history is still stored on this device.</p></div>";return}
  const st=stats(), missed=missedWorkouts();
  if(i.day===7){app.innerHTML="<div class='hero'><div class='k'>Today • "+fmt(d)+"</div><h2>Rest / Recovery</h2><p>Block "+i.block+" • Week "+i.week+"</p><span class='badge'>RECOVERY DAY</span></div><div class='grid'><div class='stat'><b>"+st.done+"</b><span>Completed</span></div><div class='stat'><b>"+st.missed+"</b><span>Missed</span></div><div class='stat'><b>"+st.adherence+"%</b><span>Adherence</span></div></div><div class='good'><b>Recovery day.</b> Your next training day is the next Day 1.</div>"+footer();return}
  const arr=list(i),done=arr.filter(function(x){return get(d,L,x.name).done}).length,hist=state.history[historyKey(d,L)];
  let h="<div class='hero'><div class='k'>Today • "+fmt(d)+"</div><h2>Day "+i.day+" — "+DAY_FOCUS[i.day-1]+"</h2><p>Block "+String(i.block).padStart(2,"0")+" • Week "+i.week+" • "+BLOCKS[i.block-1].title+"</p><span class='badge'>"+(hist==="completed"?"COMPLETED":"TODAY'S WORKOUT")+"</span></div>";
  h+="<div class='grid'><div class='stat'><b id='count'>"+done+"/"+arr.length+"</b><span>Exercises done</span></div><div class='stat'><b>"+st.done+"</b><span>Total completed</span></div><div class='stat'><b>"+st.adherence+"%</b><span>Adherence</span></div></div>";
  if(missed.length){
    h+="<div class='notice'><b>Missed workout available.</b> You can train one of your missed sessions today; the sequence will restart from that session.</div>";
    missed.slice(0,4).forEach(function(item){
      const mi=item.info;
      h+="<div class='card'><b>"+fmt(item.date)+" • Day "+mi.day+"</b><div class='muted'>Block "+String(mi.block).padStart(2,"0")+" • Week "+mi.week+" • "+DAY_FOCUS[mi.day-1]+"</div><button class='button' data-missed-date='"+item.date+"' data-missed-logical='"+item.L+"'>Do this missed workout today</button></div>";
    });
  }
  if(hist==="completed")h+="<div class='good'><b>Workout completed.</b> Tomorrow the next scheduled workout will appear automatically.</div>";
  arr.forEach(function(x,idx){const e=get(d,L,x.name);const eff=i.week===1?"3 RIR":i.week===2?"2 RIR":i.week===3?"1–2 RIR":"3–4 RIR";h+="<div class='card'><div class='top'><img class='eximg tappableImg' data-media='image' data-ex='"+esc(x.name)+"' src='"+x.image+"' onerror='this.onerror=null;this.src=\""+imgFallback(x.name)+"\"' alt=''><div><div class='exname'>"+(idx+1)+". "+esc(x.name)+"</div><div class='muted'>"+esc(x.muscles)+"</div></div></div><div class='metrics'><div class='metric'><b>"+x.sets+"</b><span>sets</span></div><div class='metric'><b>"+esc(x.prescription.replace(/^\\d+ × /,""))+"</b><span>reps</span></div><div class='metric'><b>"+eff+"</b><span>effort</span></div><div class='metric'><b>"+esc(x.rest)+"</b><span>rest</span></div></div><div class='cue'><b>Technique:</b> "+esc(x.cue)+"</div><div class='log'><input data-ex='"+esc(x.name)+"' data-field='load' value='"+esc(e.load||"")+"' inputmode='decimal' placeholder='Load kg'><input data-ex='"+esc(x.name)+"' data-field='reps' value='"+esc(e.reps||"")+"' inputmode='numeric' placeholder='Actual reps'></div><label class='check'><input type='checkbox' data-ex='"+esc(x.name)+"' data-field='done' "+(e.done?"checked":"")+"> Exercise completed</label><div class='media'><button data-media='video' data-ex='"+esc(x.name)+"'>▶ "+(DIRECT_VIDEOS[x.name]?"Watch video":"Video options")+"</button></div></div>"});
  h+="<div class='card'><div class='section'>SESSION NOTES</div><textarea id='notes' placeholder='Energy, pump, PRs, substitutions...'>"+esc(state.notes[historyKey(d,L)]||"")+"</textarea></div>";
  h+="<button class='button' id='complete'>✓ Mark today's workout completed</button><button class='button secondary' id='skip'>I skipped today's workout</button>"+footer();
  app.innerHTML=h;
  document.getElementById("complete").onclick=function(){state.history[historyKey(d,L)]="completed";save();renderToday()};
  document.getElementById("skip").onclick=function(){state.history[historyKey(d,L)]="missed";save();renderToday()};
  document.getElementById("notes").oninput=function(e){state.notes[historyKey(d,L)]=e.target.value;save()};
  document.querySelectorAll("[data-field]").forEach(function(inp){inp.addEventListener(inp.type==="checkbox"?"change":"input",function(e){const nm=e.currentTarget.getAttribute("data-ex"),f=e.currentTarget.getAttribute("data-field");put(d,L,nm,f,f==="done"?e.currentTarget.checked:e.currentTarget.value);const c=document.getElementById("count");if(c)c.textContent=arr.filter(function(q){return get(d,L,q.name).done}).length+"/"+arr.length})});
  document.querySelectorAll("[data-media]").forEach(function(btn){btn.onclick=function(){const nm=btn.getAttribute("data-ex"),x=arr.find(function(q){return q.name===nm});if(x)openMedia(btn.getAttribute("data-media"),x)}});
  document.querySelectorAll("[data-missed-date]").forEach(function(btn){
    btn.onclick=function(){
      doMissedToday({date:btn.getAttribute("data-missed-date"),L:Number(btn.getAttribute("data-missed-logical")),info:info(Number(btn.getAttribute("data-missed-logical")))});
    }
  });
}
function renderUpcoming(){
  setTab("tUpcoming");const today0=today(),app=document.getElementById("app");let h="<div class='hero'><div class='k'>Upcoming</div><h2>Your next 14 days</h2><p>Move a future workout to today or swap it with today's workout. Changes are saved on this device.</p></div>";
  for(let n=0;n<14;n++){const d=addDays(today0,n),L=logical(d),i=info(L);if(!i||i.complete)continue;const title=i.day===7?"Rest / Recovery":"Day "+i.day+" — "+DAY_FOCUS[i.day-1];const st=i.day===7?"rest":(state.history[historyKey(d,L)]||"planned");h+="<div class='up'><div class='uphead'><div><b>"+title+"</b><div class='muted'>Block "+String(i.block).padStart(2,"0")+" • Week "+i.week+" • "+BLOCKS[i.block-1].title+"</div><div class='muted'>"+(st==="completed"?"COMPLETED":st==="missed"?"MISSED":st==="rest"?"REST":"UPCOMING")+"</div></div><div class='date'>"+(n===0?"TODAY":fmt(d))+"</div></div>";if(n>0&&i.day<=6&&st!=="completed")h+="<div class='upactions'><button class='do' data-action='do' data-date='"+d+"' data-logical='"+L+"'>Do this today</button><button class='swap' data-action='swap' data-date='"+d+"' data-logical='"+L+"'>Swap with today</button></div>";h+="</div>"}
  h+="<div class='section'>SCHEDULE TOOLS</div><div class='card'><button class='button danger' id='resetSchedule'>Reset manual schedule changes</button><div class='muted' style='margin-top:7px'>This does not erase workout history.</div></div>"+footer();app.innerHTML=h;
  document.querySelectorAll("[data-action]").forEach(function(btn){btn.onclick=function(){const target=btn.getAttribute("data-date"),TL=Number(btn.getAttribute("data-logical")),td=today(),tL=logical(td);if(btn.getAttribute("data-action")==="swap"){state.overrides[td]=TL;state.overrides[target]=tL}else{const dist=days(td,target);const arr=[];for(let j=0;j<=dist;j++){const dd=addDays(td,j);arr.push({date:dd,L:logical(dd)})}state.overrides[arr[0].date]=arr[arr.length-1].L;for(let j=1;j<arr.length;j++)state.overrides[arr[j].date]=arr[j-1].L}save();renderUpcoming()}});
  document.getElementById("resetSchedule").onclick=function(){state.overrides={};save();renderUpcoming()};
}
function renderProgress(){
  setTab("tProgress");const st=stats(),app=document.getElementById("app");let h="<div class='hero'><div class='k'>Progress</div><h2>"+st.done+" completed workouts</h2><p>Your progress is stored locally on this device.</p></div><div class='grid'><div class='stat'><b>"+st.done+"</b><span>Completed</span></div><div class='stat'><b>"+st.missed+"</b><span>Missed</span></div><div class='stat'><b>"+st.adherence+"%</b><span>Adherence</span></div></div><div class='card'><div class='section'>RESET PROGRAM</div><div class='muted'>This erases workout history, weights, reps, notes and manual schedule changes, then starts a brand-new journey at Day 1 today.</div><button class='button danger' id='resetAll'>Reset everything and start Day 1</button></div><div class='section'>RECENT HISTORY</div>";
  const arr=Object.keys(state.history).sort().reverse().slice(0,25);arr.forEach(function(k){const parts=k.split("|"),d=parts[0],L=Number(parts[1]),i=info(L);h+="<div class='card'><b>"+fmt(d)+"</b><div class='muted'>"+(i?"Block "+i.block+" • Week "+i.week+" • "+(i.day===7?"Rest":DAY_FOCUS[i.day-1]):"")+" — <b>"+state.history[k].toUpperCase()+"</b></div></div>"});h+=footer();app.innerHTML=h;
  document.getElementById("resetAll").onclick=function(){if(confirm("Reset everything and start from Day 1 today? This cannot be undone unless you have a backup.")){state=emptyState();save();renderToday()}};
}
function renderPlan(){
  setTab("tPlan");const app=document.getElementById("app");let h="<div class='hero'><div class='k'>Annual plan</div><h2>13 blocks • 52 weeks</h2><p>Six training days per week with two substantial lower-body sessions every week. Quads, hamstrings, glutes, calves and core are treated as major aesthetic targets.</p></div>";
  BLOCKS.forEach(function(b){h+="<div class='card'><b>Block "+String(b.id).padStart(2,"0")+" — "+esc(b.title)+"</b><div class='muted'>Weeks "+b.weeks[0]+"–"+b.weeks[1]+"</div><div class='muted' style='margin-top:5px'>D1 "+DAY_FOCUS[0]+" • D2 "+DAY_FOCUS[1]+" • D3 "+DAY_FOCUS[2]+" • D4 "+DAY_FOCUS[3]+" • D5 "+DAY_FOCUS[4]+" • D6 "+DAY_FOCUS[5]+"</div></div>"});h+=footer();app.innerHTML=h;
}
function footer(){return "<div class='footer'>Real exercise photos are loaded from the Free Exercise DB. Selected verified direct-hosted demonstrations play inside the app as native video; other exercises provide an external search option. Workout logs are stored locally in your browser. Use Progress → Reset everything to start over, and use a backup/export before clearing browser data.</div>"}
document.getElementById("tToday").onclick=renderToday;
document.getElementById("tUpcoming").onclick=renderUpcoming;
document.getElementById("tProgress").onclick=renderProgress;
document.getElementById("tPlan").onclick=renderPlan;

markOldMissed();
renderToday();
</script>
</body>
</html>
