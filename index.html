<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#111827">
<title>Aesthetic Gym — 52 Week Tracker</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f6f9;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
header{position:sticky;top:0;z-index:20;background:rgba(244,246,249,.97);backdrop-filter:blur(14px);padding:12px;border-bottom:1px solid #e5e7eb}
h1{font-size:19px;margin:0 0 2px}
.sub{font-size:11px;color:#6b7280}
.tabs{display:flex;gap:6px;margin-top:10px;overflow:auto}.tabs button{flex:1 0 auto;min-width:88px}
.tabs button{border:0;border-radius:12px;padding:10px 7px;background:#e7ecf4;font-weight:700}
.tabs button.active{background:#111827;color:#fff}
main{max-width:760px;margin:0 auto;padding:12px}
.hero{background:#111827;color:#fff;border-radius:18px;padding:16px;margin-bottom:10px}
.tag{font-size:10px;opacity:.65;letter-spacing:.08em;text-transform:uppercase}
.hero h2{font-size:23px;margin:4px 0}
.hero p{font-size:12px;color:#dce4ef;line-height:1.45;margin:0}
.todaybadge{display:inline-block;margin-top:8px;border-radius:999px;background:#2563eb;color:#fff;padding:6px 9px;font-size:10px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0}
.stat{background:#fff;border:1px solid #e4e7ec;border-radius:14px;padding:10px}
.stat b{display:block;font-size:15px}
.stat span{font-size:9px;color:#6b7280}
.notice{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;padding:11px;border-radius:14px;font-size:12px;line-height:1.45;margin:10px 0}
.success{background:#f0fdf4;border:1px solid #bbf7d0;color:#166534;padding:11px;border-radius:14px;font-size:12px;line-height:1.45;margin:10px 0}
.card{background:#fff;border:1px solid #e4e7ec;border-radius:18px;padding:12px;margin:9px 0;box-shadow:0 2px 9px rgba(0,0,0,.045)}
.top{display:flex;gap:10px;align-items:center}
.eximg{width:102px;height:78px;object-fit:cover;border-radius:11px;background:#eee;border:1px solid #e5e7eb;flex:none}
.exname{font-size:15px;font-weight:750}
.muscles{font-size:11px;color:#6b7280;margin-top:3px}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.metric{background:#f7f8fa;border-radius:10px;padding:7px 3px;text-align:center}
.metric b{display:block;font-size:11px}
.metric span{font-size:8px;color:#6b7280}
.cue{font-size:11px;color:#374151;line-height:1.45;margin:9px 0}
.log{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.log input{width:100%;border:1px solid #d7dce5;border-radius:11px;padding:10px}
.done{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:650;margin-top:9px}
.done input{width:19px;height:19px;accent-color:#2563eb}
.primary{width:100%;border:0;border-radius:14px;background:#2563eb;color:#fff;font-size:15px;font-weight:750;padding:14px;margin-top:11px}
.secondary{width:100%;border:1px solid #d7dce5;border-radius:14px;background:#fff;color:#111827;font-size:13px;font-weight:700;padding:12px;margin-top:7px}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:9px 0}
select,button,input,textarea{font:inherit}
select{width:100%;border:1px solid #d7dce5;border-radius:11px;padding:10px;background:#fff}
textarea{width:100%;min-height:84px;border:1px solid #d7dce5;border-radius:12px;padding:10px;resize:vertical}
.sectiontitle{font-size:12px;font-weight:800;letter-spacing:.07em;color:#6b7280;margin:14px 2px 6px}
.history{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:10px;margin:7px 0}
.historyline{display:flex;justify-content:space-between;gap:8px;font-size:12px}
.statusdone{color:#15803d;font-weight:800}
.statusmissed{color:#b91c1c;font-weight:800}
.statusrest{color:#6b7280;font-weight:700}
.small{font-size:10px;color:#6b7280;line-height:1.45}
.photoCredit{font-size:9px;color:#6b7280;margin-top:6px}
.footer{font-size:10px;color:#6b7280;line-height:1.45;margin:12px 2px 35px}
@media(min-width:600px){main{padding:18px}.card{padding:14px}}

.upcomingcard{background:#fff;border:1px solid #e4e7ec;border-radius:16px;padding:11px;margin:8px 0}
.upcominghead{display:flex;justify-content:space-between;gap:9px;align-items:flex-start}
.datepill{font-size:10px;font-weight:800;color:#2563eb;background:#eff6ff;border-radius:999px;padding:5px 7px;white-space:nowrap}
.daytitle{font-size:14px;font-weight:750}
.meta{font-size:10px;color:#6b7280;margin-top:3px;line-height:1.4}
.upactions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:9px}
.upactions button{border-radius:10px;padding:9px 7px;font-size:11px;font-weight:750}
.upactions .do{border:0;background:#2563eb;color:#fff}
.upactions .swap{border:1px solid #d7dce5;background:#fff;color:#111827}
.pickerpanel{background:#fff;border:1px solid #e4e7ec;border-radius:16px;padding:11px;margin:8px 0}
.pickerpanel .small{margin-bottom:7px}

.mediaButtons{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}
.mediaBtn{border:1px solid #d7dce5;border-radius:11px;background:#fff;padding:10px 8px;font-size:11px;font-weight:750}
.mediaBtn.primaryMedia{background:#111827;color:#fff;border-color:#111827}
.overlay{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.93);display:none;align-items:center;justify-content:center;padding:14px}
.overlay.show{display:flex}
.overlayInner{width:100%;max-width:950px;max-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.overlay img{max-width:100%;max-height:82vh;object-fit:contain;border-radius:10px;background:#fff}
.videoFrame{width:100%;max-width:950px;aspect-ratio:16/9;border:0;border-radius:10px;background:#000}
.closeBtn{position:absolute;right:0;top:-2px;z-index:2;width:42px;height:42px;border:0;border-radius:50%;background:#fff;color:#111;font-size:25px;font-weight:800}
.overlayTitle{color:#fff;font-size:13px;font-weight:750;text-align:center;margin-top:9px;max-width:92%}
.overlaySub{color:#cbd5e1;font-size:10px;text-align:center;margin-top:3px;max-width:92%}
</style>
</head>
<body>
<header>
  <h1>52-Week Aesthetic Gym</h1>
  <div class="sub">Today's workout • missed-day recovery • progress tracking</div>
  <div class="tabs">
    <button id="tabToday">Today</button>
    <button id="tabUpcoming">Upcoming</button>
    <button id="tabProgress">Progress</button>
    <button id="tabPlan">Plan</button>
  </div>
</header>
<div id="mediaOverlay" class="overlay" aria-hidden="true">
  <div class="overlayInner">
    <button id="mediaClose" class="closeBtn" aria-label="Close">×</button>
    <div id="mediaBody" style="width:100%;display:flex;flex-direction:column;align-items:center"></div>
  </div>
</div>
<main><div id="app"></div></main>

function scheduledLogicalForDate(dateStr){

function doFutureToday(targetDate,targetLogical){
  // Move the selected future workout to today, shifting every scheduled workout

  const today=currentDate();
  if(targetDate===today) return;

  const distance=daysBetween(today,targetDate);
  if(distance<=0 || distance>30) return;

  const assignments=[];
  for(let i=0;i<=distance;i++){
    const d=addDays(today,i);
    assignments.push({
      date:d,
      logical:scheduledLogicalForDate(d)

  }

  // Today gets the selected future workout.
  setOverride(assignments[0].date, assignments[distance].logical);

  // Every workout that was between today and the selected date moves one day later.
  for(let i=1;i<=distance;i++){

    if(st==="completed") streak++; else break;
  }
  return {done,missed,adherence,streak};
}

function setImageError(img, fallback){
  img.onerror=null;img.src=fallback;
}


function openMedia(type, exercise){
  const overlay=document.getElementById("mediaOverlay");
  const body=document.getElementById("mediaBody");
  if(!overlay || !body) return;
  if(type==="image"){
    body.innerHTML='<img src="'+exercise.image+'" alt="'+escapeAttr(exercise.name)+'"><div class="overlayTitle">'+escapeHtml(exercise.name)+'</div><div class="overlaySub">Tap × or outside the image to close</div>';
  } else {
    const v=VERIFIED_VIDEOS[exercise.name];
    if(v){
      body.innerHTML='<iframe class="videoFrame" src="https://www.youtube-nocookie.com/embed/'+v.id+'?playsinline=1&rel=0" title="'+escapeAttr(v.title)+'" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe><div class="overlayTitle">'+escapeHtml(v.title)+'</div><div class="overlaySub">'+escapeHtml(v.channel)+' • YouTube</div>';
    } else {
      const q=encodeURIComponent(exercise.name+" exercise proper form");
      body.innerHTML='<div style="width:100%;text-align:center;color:#fff;padding:40px 10px"><div style="font-size:18px;font-weight:800;margin-bottom:8px">No verified in-app video for this exercise</div><div style="color:#cbd5e1;font-size:12px;margin-bottom:15px">Use YouTube search to find a current demonstration.</div><a href="https://www.youtube.com/results?search_query='+q+'" target="_blank" rel="noopener" style="display:inline-block;background:#fff;color:#111;padding:12px 15px;border-radius:12px;font-weight:800;text-decoration:none">Open YouTube search</a></div>';
    }
  }
  overlay.classList.add("show");
  overlay.setAttribute("aria-hidden","false");
}
function closeMedia(){
  const overlay=document.getElementById("mediaOverlay");
  const body=document.getElementById("mediaBody");
  if(body) body.innerHTML="";
  if(overlay){overlay.classList.remove("show");overlay.setAttribute("aria-hidden","true");}
}
function escapeHtml(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function escapeAttr(v){return escapeHtml(v)}
document.getElementById("mediaClose")?.addEventListener("click",closeMedia);
document.getElementById("mediaOverlay")?.addEventListener("click",e=>{if(e.target.id==="mediaOverlay")closeMedia()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeMedia()});

function renderToday(){
  const app=document.getElementById("app");
  const storageNotice=STORAGE_WARNING;
  const today=currentDate(), L=scheduledLogicalForDate(today), inf=infoForLogical(L);
  const stats=progressStats(), missed=missedItems();
  if(inf.complete){
    app.innerHTML=`<section class="hero"><div class="tag">Program complete</div><h2>52 weeks completed</h2><p>You have reached the end of the current program. Your workout history remains stored on this device.</p></section>`;
    return;
  }
  if(inf.day===7){
    app.innerHTML=storageNotice+`<section class="hero"><div class="tag">Today</div><h2>Rest / Recovery</h2><p>Week ${inf.week} • Block ${String(inf.block).padStart(2,"0")} — ${BLOCKS[inf.block-1].title}</p><span class="todaybadge">NO GYM SESSION REQUIRED</span></section>
    <div class="grid"><div class="stat"><b>${stats.done}</b><span>Completed</span></div><div class="stat"><b>${stats.missed}</b><span>Missed</span></div><div class="stat"><b>${stats.adherence}%</b><span>Adherence</span></div></div>`;
    if(missed.length) app.innerHTML+=missedCard(missed);
    app.innerHTML+=`<div class="success"><b>Recovery day.</b> Next scheduled workout: Day 1 of the next 7-day cycle.</div>`;
    app.innerHTML+=footer();
    return;
  }
  const exs=exerciseList(inf);
  const done=countDone(exs,today,L);
  const hist=state.history[sessionId(today,L)];
  let html=storageNotice+`<section class="hero"><div class="tag">Today • ${formatDate(today)}</div>
    <h2>Day ${inf.day} — ${DAY_FOCUS[inf.day-1]}</h2>
    <p>Block ${String(inf.block).padStart(2,"0")} • Week ${inf.week} • ${BLOCKS[inf.block-1].title}</p>
    <span class="todaybadge">${hist==="completed"?"WORKOUT COMPLETED":"TODAY'S WORKOUT"}</span></section>
    <div class="grid"><div class="stat"><b id="doneCount">${done}/${exs.length}</b><span>Exercises checked</span></div><div class="stat"><b>${stats.done}</b><span>Total completed</span></div><div class="stat"><b>${stats.adherence}%</b><span>Adherence</span></div></div>`;
  if(missed.length){
    html+=missedCard(missed);
  }
  if(hist==="completed"){
    html+=`<div class="success"><b>Workout completed.</b> Tomorrow the app will automatically move to the next workout in the sequence.</div>`;
  } else {
    html+=`<button class="primary" id="completeDay">✓ Mark today's workout completed</button>
           <button class="secondary" id="skipDay">I skipped today's workout</button>`;
  }
  exs.forEach((x,i)=>{
    const e=getLog(today,L,x);
    const fallback=fallbackPhoto(x.name);
    html+=`<article class="card">
      <div class="top"><img class="eximg" src="${x.image}" alt="" loading="lazy" decoding="async" onerror="this.onerror=null;this.src='${fallback}'">
      <div><div class="exname">${i+1}. ${x.name}</div><div class="muscles">${x.muscles}</div></div></div>
      <div class="metrics">
        <div class="metric"><b>3</b><span>sets</span></div>
        <div class="metric"><b>${x.prescription}</b><span>reps</span></div>
        <div class="metric"><b>${inf.week===1?"3":inf.week===2?"2":inf.week===3?"1–2":"3–4"} RIR</b><span>effort</span></div>
        <div class="metric"><b>${x.rest}</b><span>rest</span></div>
      </div>
      <div class="cue"><b>Technique:</b> ${x.cue}</div>
      <div class="log"><input inputmode="decimal" placeholder="Load kg" value="${e.load||""}" data-name="${enc(x.name)}" data-field="load">
      <input inputmode="numeric" placeholder="Actual reps" value="${e.reps||""}" data-name="${enc(x.name)}" data-field="reps"></div>
      <label class="done"><input type="checkbox" ${e.done?"checked":""} data-name="${enc(x.name)}" data-field="done"> Exercise completed</label>
      <div class="mediaButtons">
        <button class="mediaBtn primaryMedia" data-media="image" data-exercise="${enc(x.name)}">⛶ View full image</button>
        <button class="mediaBtn" data-media="video" data-exercise="${enc(x.name)}">${VERIFIED_VIDEOS[x.name] ? "▶ Watch video" : "▶ Find video"}</button>
      </div>
      <div class="photoCredit">${x.imageSource}</div>
    </article>`;
  });
  html+=`<div class="card"><div class="sectiontitle">SESSION NOTES</div>
    <textarea id="notes" placeholder="Energy, pump, PRs, substitutions...">${state.notes[noteKey(today,L)]||""}</textarea></div>`;
  html+=footer();
  app.innerHTML=html;
  document.getElementById("completeDay")?.addEventListener("click",markComplete);
  document.getElementById("skipDay")?.addEventListener("click",()=>{continueToday()});
  document.querySelectorAll('input[data-field]').forEach(inp=>inp.addEventListener(inp.type==="checkbox"?"change":"input",ev=>{
    const name=dec(ev.currentTarget.dataset.name), k=logKey(today,L,{name});
    const e=getLog(today,L,{name});
    e[ev.currentTarget.dataset.field]=ev.currentTarget.dataset.field==="done"?ev.currentTarget.checked:ev.currentTarget.value;
    state.logs[k]=e;save();updateProgressOnly();
  }));
  document.getElementById("notes")?.addEventListener("input",ev=>{state.notes[noteKey(today,L)]=ev.target.value;save()});
  document.querySelectorAll('[data-media]').forEach(btn=>btn.addEventListener("click",()=>{
    const name=dec(btn.dataset.exercise);
    const ex=exs.find(z=>z.name===name);
    if(ex) openMedia(btn.dataset.media,ex);
  }));

}
function enc(x){return encodeURIComponent(x)}
function dec(x){return decodeURIComponent(x)}
function fallbackPhoto(name){
  const chest="https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Barbell_Bench_Press_-_Medium_Grip/0.jpg", back="https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Wide-Grip_Lat_Pulldown/0.jpg", leg="https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Barbell_Squat/0.jpg", core="https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Cable_Crunch/0.jpg";
  const n=name.toLowerCase();
  if(n.includes("press")||n.includes("fly")||n.includes("pec")) return chest;
  if(n.includes("pulldown")||n.includes("pull-up")||n.includes("row")) return back;
  if(n.includes("squat")||n.includes("lunge")||n.includes("leg")) return leg;
  return core;
}
function updateProgressOnly(){
  const today=currentDate(),L=logicalForDate(today),inf=infoForLogical(L),exs=exerciseList(inf),done=countDone(exs,today,L);
  const p=document.getElementById("doneCount");if(p)p.textContent=`${done}/${exs.length}`;
}
function missedCard(missed){
  let h='<div class="notice"><b>You have a missed workout.</b> You can do it today and the sequence will restart from that missed workout.</div>';
  missed.slice(0,5).forEach(x=>{
    h+=`<div class="history"><div class="historyline"><div><b>${formatDate(x.date)} • Day ${x.info.day}</b><br><span class="small">Block ${String(x.info.block).padStart(2,"0")} • Week ${x.info.week} • ${DAY_FOCUS[x.info.day-1]}</span></div><button class="secondary" style="width:auto;margin:0;padding:8px 10px" data-missed="${x.date}|${x.logical}">Do this workout</button></div></div>`;
  });
  return h;
}

function wireMissedButtons(){
  document.querySelectorAll('[data-missed]').forEach(btn=>btn.addEventListener("click",()=>{
    const [date,L]=btn.dataset.missed.split("|");doMissed(date,Number(L));
  }));
}


function renderUpcoming(){
  const app=document.getElementById("app");
  const today=currentDate();
  const items=plannedDatesAroundToday();
  let html=`<section class="hero"><div class="tag">Upcoming workouts</div>
    <h2>Your training calendar</h2>
    <p>Choose any upcoming workout to move it to today or swap it with today's planned session.</p></section>`;

  const future=items.filter(x=>x.offset>=0).slice(0,14);
  html+=`<div class="pickerpanel"><div class="small"><b>Current sequence:</b> Today is automatically determined from your training timeline. Changes here are saved on this device.</div>
    <button class="secondary" id="resetSchedule" style="margin-top:7px">Reset all schedule adjustments</button></div>`;

  future.forEach(x=>{
    const isToday=x.offset===0;
    const status=x.status;
    const label=status==="completed"?"COMPLETED":status==="missed"?"MISSED":status==="rest"?"REST / RECOVERY":isToday?"TODAY":"UPCOMING";
    const title=x.info.day===7 ? "Rest / Recovery" : `Day ${x.info.day} — ${DAY_FOCUS[x.info.day-1]}`;
    const block=BLOCKS[x.info.block-1];
    html+=`<div class="upcomingcard">
      <div class="upcominghead">
        <div><div class="daytitle">${title}</div>
        <div class="meta">Block ${String(x.info.block).padStart(2,"0")} • Week ${x.info.week} • ${block.title}</div></div>
        <div class="datepill">${isToday?"TODAY":formatDate(x.date)}</div>
      </div>
      <div class="meta" style="margin-top:7px">${label}</div>`;
    if(!isToday && x.info.day<=6 && status!=="completed"){
      html+=`<div class="upactions">
        <button class="do" data-action="do" data-date="${x.date}" data-logical="${x.logical}">Do this today</button>
        <button class="swap" data-action="swap" data-date="${x.date}" data-logical="${x.logical}">Swap with today</button>
      </div>`;
    }
    html+=`</div>`;
  });

  html+=`<div class="sectiontitle">HOW THE TWO OPTIONS WORK</div>
    <div class="card"><b>Do this today</b><div class="small">The selected future workout becomes today's workout. Every workout between today and that date shifts one day later, preserving the workout sequence.</div></div>
    <div class="card"><b>Swap with today</b><div class="small">Only today and the selected future date exchange workouts. The other dates stay unchanged.</div></div>
    ${footer()}`;
  app.innerHTML=html;

  document.getElementById("resetSchedule").onclick=()=>{
    if(confirm("Reset all manual schedule changes?")) resetScheduleAdjustments();
  };
  document.querySelectorAll('[data-action="do"]').forEach(btn=>btn.onclick=()=>{
    doFutureToday(btn.dataset.date,Number(btn.dataset.logical));
  });
  document.querySelectorAll('[data-action="swap"]').forEach(btn=>btn.onclick=()=>{
    swapWithToday(btn.dataset.date,Number(btn.dataset.logical));
  });
}

function renderProgress(){
  const st=progressStats(), hist=allHistory(), today=currentDate(), current=currentInfo();
  let html=STORAGE_WARNING+`<section class="hero"><div class="tag">Progress</div><h2>${st.done} completed workouts</h2><p>Your history is stored locally on this device.</p></section>
  <div class="grid"><div class="stat"><b>${st.done}</b><span>Completed</span></div><div class="stat"><b>${st.missed}</b><span>Missed</span></div><div class="stat"><b>${st.adherence}%</b><span>Adherence</span></div></div>
  <div class="grid"><div class="stat"><b>${st.streak}</b><span>Current streak</span></div><div class="stat"><b>Day ${current.day}</b><span>Current day</span></div><div class="stat"><b>B${String(current.block).padStart(2,"0")}</b><span>Current block</span></div></div>
  <div class="sectiontitle">RECENT HISTORY</div>`;
  hist.slice(0,20).forEach(x=>{
    const label=x.info?.complete?"Program complete":x.info?.day===7?"Rest":`Day ${x.info?.day} • ${DAY_FOCUS[(x.info?.day||1)-1]}`;
    const cls=x.status==="completed"?"statusdone":"statusmissed";
    html+=`<div class="history"><div class="historyline"><span><b>${formatDate(x.date)}</b><br><span class="small">B${String(x.info?.block||0).padStart(2,"0")} • W${x.info?.week||"-"} • ${label}</span></span><span class="${cls}">${x.status==="completed"?"COMPLETED":"MISSED"}</span></div></div>`;
  });
  html+=`<div class="sectiontitle">DATA BACKUP</div><div class="card">
    <div class="small">Because this is a Safari/local HTML app, keep a backup of your workout data. You can export it and later import it on the same or another phone.</div>
    <div class="controls"><button class="secondary" id="exportBackup">Export backup</button><button class="secondary" id="importBtn">Import backup</button></div>
    <input type="file" id="importFile" accept="application/json" style="display:none">
  </div>${footer()}`;
  document.getElementById("app").innerHTML=html;
  document.getElementById("exportBackup").onclick=exportBackup;
  document.getElementById("importBtn").onclick=()=>document.getElementById("importFile").click();
  document.getElementById("importFile").onchange=importBackup;
}

function renderPlan(){
  let html=`<section class="hero"><div class="tag">Annual plan</div><h2>13 training blocks</h2><p>Each block lasts 4 weeks. Weeks 1–3 progress; Week 4 is the deload/pivot. Exercise selection rotates throughout the year.</p></section>`;
  BLOCKS.forEach(b=>{
    const exToday=WORKOUT[String(b.id)]["1"]||[];
    html+=`<div class="card"><b>Block ${String(b.id).padStart(2,"0")} — ${b.title}</b><div class="small">Weeks ${b.weeks[0]}–${b.weeks[1]}</div><div class="small" style="margin-top:5px">Day 1: ${DAY_FOCUS[0]} • Day 2: ${DAY_FOCUS[1]} • Day 3: ${DAY_FOCUS[2]} • Day 4: ${DAY_FOCUS[3]} • Day 5: ${DAY_FOCUS[4]} • Day 6: ${DAY_FOCUS[5]}</div></div>`;
  });
  html+=footer();document.getElementById("app").innerHTML=html;
}

function exportBackup(){
  const data=JSON.stringify(state,null,2);const blob=new Blob([data],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="aesthetic-gym-backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function importBackup(ev){
  const f=ev.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d || typeof d!=="object" || !("history" in d)) throw new Error("Invalid backup");
      state=d;save();render();
      alert("Backup imported successfully.");
    }catch(e){alert("This file is not a valid Aesthetic Gym backup.")}
  };r.readAsText(f);
}

function footer(){
 return `<div class="footer">Exercise photos are real reference photos from the Free Exercise DB public-domain exercise dataset. Verified YouTube demonstrations play inside the app for selected exercises; exercises without a verified demo provide a YouTube search link. The app uses local browser storage for your workout log; use <b>Progress → Export backup</b> periodically so your history can be restored if Safari clears local site data. Form cues are brief references, not a substitute for coaching.</div>`;
}

function render(){
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.remove("active"));
  if(activeTab==="today"){document.getElementById("tabToday").classList.add("active");renderToday()}
  if(activeTab==="upcoming"){document.getElementById("tabUpcoming").classList.add("active");renderUpcoming()}
  if(activeTab==="progress"){document.getElementById("tabProgress").classList.add("active");renderProgress()}
  if(activeTab==="plan"){document.getElementById("tabPlan").classList.add("active");renderPlan()}
  wireMissedButtons();
}
document.getElementById("tabToday").onclick=()=>{activeTab="today";render()};
document.getElementById("tabUpcoming").onclick=()=>{activeTab="upcoming";render()};
document.getElementById("tabProgress").onclick=()=>{activeTab="progress";render()};
document.getElementById("tabPlan").onclick=()=>{activeTab="plan";render()};

boot();render();
</script>
